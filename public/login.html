<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center — Sign in</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23C9A96B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The same tokens as the dashboard, so signing in and landing do not
   look like two products. */
:root{--ink:#0E0D0C;--panel:#161513;--edge:#2C2926;--edge2:#3A3630;--cream:#EFEBE4;--text:#CFC8BC;--dim:#A29B90;--dimmer:#8A8377;--brass:#C9A96B;--rust:#C08268;--jade:#8FB48C}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:var(--ink);color:var(--text);
  font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.box{width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brass)}
.brand b{font-variation-settings:'wght' 700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}
h1{font-size:24px;font-variation-settings:'wght' 700;color:var(--cream);letter-spacing:-.01em}
p.sub{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5}
form{margin-top:22px;display:flex;flex-direction:column;gap:10px}
label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer)}
input{
  width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:8px;
  padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;outline:0;
}
input:focus{border-color:var(--edge2)}
button{
  margin-top:4px;background:var(--cream);color:#1B1916;border:0;border-radius:8px;
  padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
button:hover{opacity:.9}
.note{
  margin-top:16px;border:1px solid #3A2A22;background:#1C1310;color:var(--rust);
  border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;
}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="pulse"></span><b>Command</b></div>
  <h1>Sign in</h1>
  <p class="sub">This dashboard holds connected mailboxes, leads, properties and financials. Sign in with the address it was set up for.</p>

  <div id="note" class="note" hidden></div>

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username"
           spellcheck="false" autocapitalize="none" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</div>
<script>
  /* One message per outcome, and the wrong-credentials one deliberately does
     not say which half was wrong. */
  var q = new URLSearchParams(location.search);
  var msg = q.has('error') ? 'That email and password do not match an account.'
    : q.has('down') ? 'The sign-in service could not be reached. Try again in a moment.'
    : q.has('gone') ? 'That account is no longer active on this dashboard.'
    : q.has('out') ? 'Signed out.'
    : null;
  if (msg) {
    var n = document.getElementById('note');
    n.textContent = msg;
    if (q.has('out')) { n.style.borderColor = '#243024'; n.style.background = '#121711'; n.style.color = '#8FB48C'; }
    n.hidden = false;
  }
</script>
</body>
</html>
