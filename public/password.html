<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center — Set a password</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23C9A96B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0D0C;--panel:#161513;--edge:#2C2926;--edge2:#3A3630;--cream:#EFEBE4;--text:#CFC8BC;--dim:#A29B90;--dimmer:#8A8377;--brass:#C9A96B;--rust:#C08268;--jade:#8FB48C}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:var(--ink);color:var(--text);
  font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.box{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brass)}
.brand b{font-variation-settings:'wght' 700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}
h1{font-size:24px;font-variation-settings:'wght' 700;color:var(--cream);letter-spacing:-.01em}
p.sub{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5}
form{margin-top:22px;display:flex;flex-direction:column;gap:10px}
label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer)}
input{
  width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:8px;
  padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;outline:0;
}
input:focus{border-color:var(--edge2)}
button{
  margin-top:4px;background:var(--cream);color:#1B1916;border:0;border-radius:8px;
  padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
button:hover{opacity:.9}
button:disabled{opacity:.45;cursor:not-allowed}
.note{
  margin-top:16px;border:1px solid #3A2A22;background:#1C1310;color:var(--rust);
  border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;
}
.hint{font-size:12px;color:var(--dimmer);margin-top:-2px}
.hint.ok{color:var(--jade)}
.out{margin-top:18px;font-size:12px;color:var(--dimmer)}
.out a{color:var(--dim)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="pulse"></span><b>Command</b></div>
  <h1 id="title">Set a new password</h1>
  <p class="sub" id="sub">The password you signed in with was set for you, so it is not yours yet. Choose one only you know.</p>

  <div id="note" class="note" hidden></div>

  <form method="post" action="/password" id="f">
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" autocomplete="current-password" autofocus required>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <div class="hint" id="hint">At least 8 characters. Longer beats complicated.</div>
    <label for="confirm">New password again</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    <button type="submit" id="go">Save and continue</button>
  </form>

  <p class="out"><a href="/logout" onclick="event.preventDefault();document.getElementById('lo').submit()">Sign out instead</a></p>
  <form id="lo" method="post" action="/logout" hidden></form>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var msg = q.has('current') ? 'That is not your current password.'
    : q.has('match') ? 'The two new passwords do not match.'
    : q.get('bad') ? q.get('bad')
    : q.has('nouser') ? 'This session is not tied to an account, so there is no password to change. It was created with the shared APP_PASSWORD.'
    : q.has('down') ? 'Could not reach the account service. Try again in a moment.'
    : null;
  if (msg) { var n = document.getElementById('note'); n.textContent = msg; n.hidden = false; }

  /* Whether this is a forced change or a voluntary one, and the person's name,
     both come from the server rather than from the URL — a heading that can be
     set by a query string is a heading anyone can set. */
  fetch('/api/me', { headers: { accept: 'application/json' } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.user) return;
      if (!d.user.mustChangePassword) {
        document.getElementById('title').textContent = 'Change your password';
        document.getElementById('sub').textContent =
          'Signed in as ' + d.user.email + '. Choose a new password, or go back to the dashboard.';
        var p = document.createElement('p');
        p.className = 'out';
        p.innerHTML = '<a href="/">Back to the dashboard</a>';
        document.querySelector('.box').appendChild(p);
      } else {
        document.getElementById('sub').textContent =
          'Welcome, ' + (d.user.name || d.user.email) + '. The password you signed in with was set '
          + 'for you, so it is not yours yet. Choose one only you know.';
      }
      if (d.minPassword) {
        document.getElementById('hint').textContent =
          'At least ' + d.minPassword + ' characters. Longer beats complicated.';
      }
    })
    .catch(function () { /* the form works regardless */ });

  /* Said while typing rather than after submitting, because a rule you only
     learn by failing is a rule stated too late. */
  var MINPW = 8;
  var pw = document.getElementById('password');
  var cf = document.getElementById('confirm');
  var hint = document.getElementById('hint');
  var base = hint.textContent;
  function check(){
    var a = pw.value, b = cf.value;
    if (!a) { hint.textContent = base; hint.className = 'hint'; return; }
    if (a.length < MINPW) {
      hint.textContent = (MINPW - a.length) + ' more character' + (MINPW - a.length === 1 ? '' : 's');
      hint.className = 'hint';
    } else if (b && a !== b) {
      hint.textContent = 'The two do not match yet.';
      hint.className = 'hint';
    } else {
      hint.textContent = 'Long enough.';
      hint.className = 'hint ok';
    }
  }
  pw.addEventListener('input', check);
  cf.addEventListener('input', check);
</script>
</body>
</html>
